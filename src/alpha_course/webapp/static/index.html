<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F4F0">
<title>Бизнес-навигатор</title>
<link rel="stylesheet" href="app.css">
<script async data-tg src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="modulepreload" href="js/main.js">
<link rel="modulepreload" href="js/tg.js">
<link rel="modulepreload" href="js/api.js">
<link rel="modulepreload" href="js/state.js">
<link rel="modulepreload" href="js/router.js">
<link rel="modulepreload" href="js/ui.js">
<link rel="modulepreload" href="js/components.js">
<link rel="modulepreload" href="js/fmt.js">
<link rel="modulepreload" href="js/wordle-store.js">
<link rel="modulepreload" href="js/screens/today.js">
</head>
<body>
<div id="app">
  <div id="offline" role="status" hidden>Нет связи с интернетом. Показываю то, что уже загружено.</div>
  <header id="topbar" hidden></header>
  <main id="view" aria-live="polite"><div class="boot" aria-hidden="true"><div class="skel sk-a"></div><div class="skel sk-b"></div><div class="skel sk-c"></div><div class="skel sk-c"></div></div></main>
  <nav id="tabbar" aria-label="Разделы">
    <a class="tab" href="#/today" data-tab="today"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>Сегодня</a>
    <a class="tab" href="#/ask" data-tab="ask"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 6a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-5l-4 4v-4H8a3 3 0 0 1-3-3z"/></svg>Спросить</a>
    <a class="tab" href="#/route" data-tab="route"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg>Маршрут</a>
    <a class="tab" href="#/games" data-tab="games"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="7" width="18" height="11" rx="4"/><path d="M8 10v5M5.5 12.5h5M15.5 11.5h.01M18 14h.01"/></svg>Игры</a>
    <a class="tab" href="#/more" data-tab="more"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/></svg>Ещё</a>
  </nav>
</div>
<div id="layer"><div class="toasts" id="toasts" role="status" aria-live="polite"></div></div>
<noscript>Для работы Бизнес-навигатора нужен JavaScript.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
