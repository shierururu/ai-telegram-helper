[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "alpha-course"
version = "0.1.0"
description = "Telegram AI assistant for Alfa-Course entrepreneurs"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiogram==3.31.0",
  "SQLAlchemy==2.0.57",
  "psycopg[binary]==3.3.8",
  "alembic==1.20.1",
  "pydantic-settings==2.16.2",
  "tzdata==2026.6",
  "numpy==2.5.4",
  "snowballstemmer==3.0.1",
  "weasyprint==70.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_course"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires a running PostgreSQL instance"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Russian UI copy and LLM prompts read better unwrapped.
"src/alpha_course/telegram/router.py" = ["E501"]
"src/alpha_course/telegram/render.py" = ["E501"]
"src/alpha_course/application/assistant.py" = ["E501"]
"src/alpha_course/application/knowledge.py" = ["E501"]
"src/alpha_course/application/privacy.py" = ["E501"]
"tools/eval_questions.py" = ["E501"]
